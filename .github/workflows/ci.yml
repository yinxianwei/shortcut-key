name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --arch arm64
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Verify app bundle
        run: |
          plutil -lint dist/ShortcutKey.app/Contents/Info.plist
          codesign --verify --deep --strict dist/ShortcutKey.app
          test -f dist/ShortcutKey.app/Contents/Resources/AppIconCompact.icns
