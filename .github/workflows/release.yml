name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check tag and version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          test "$version" = "${GITHUB_REF_NAME#v}"
      - name: Test
        run: swift test --arch arm64
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Package app
        run: |
          codesign --verify --deep --strict dist/ShortcutKey.app
          asset="ShortcutKey-${GITHUB_REF_NAME}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/ShortcutKey.app "dist/$asset"
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="ShortcutKey-${GITHUB_REF_NAME}-macos-arm64.zip"
          gh release create "$GITHUB_REF_NAME" "dist/$asset" "dist/$asset.sha256" \
            --verify-tag --title "ShortcutKey $GITHUB_REF_NAME" --generate-notes \
            --notes "Apple Silicon / macOS 26+. Download the ZIP and move ShortcutKey.app to Applications. This build is ad-hoc signed and not notarized; macOS may require approval in System Settings → Privacy & Security on first launch."
